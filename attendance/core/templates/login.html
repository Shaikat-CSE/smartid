{# templates/login.html #}
{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Smart Attendance System{% endblock %}

{% block extra_head %}
<style>
    .camera-container {
        position: relative;
        width: 100%;
        max-width: 480px;
        height: auto;
        aspect-ratio: 4/3;
        margin: 0 auto;
        border-radius: 1rem;
        overflow: hidden;
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }
    .scan-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #4F46E5, transparent);
        animation: scan 2s linear infinite;
    }
    @keyframes scan {
        0% { top: 0; }
        100% { top: 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="max-w-xl w-full glass-card rounded-2xl p-8 animate-fade-in">
        <h2 class="text-3xl font-bold text-white mb-8 text-center">Face Recognition Login</h2>

        <div class="camera-container">
            <div class="scan-line"></div>
            <video id="video" class="w-full h-full object-cover" autoplay playsinline></video>
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <div class="mt-8 flex justify-center">
            <button id="loginBtn"
                    class="btn-primary text-lg px-8 py-4">
                Verify Face
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/webcam.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const webcam = new WebcamCapture(video, canvas);
    
    webcam.start().catch(err => {
        alert('Error accessing webcam: ' + err.message);
    });

    document.getElementById('loginBtn').addEventListener('click', async function() {
        await handleLogin(webcam);
    });
});
</script>
{% endblock %}
